# This is an example Starter pipeline configuration
# Use a skeleton to build, test and deploy using manual and parallel steps
#--------------
# You can specify a custom docker image from Docker Hub as your build environment.

image: atlassian/default-image:3

pipelines:
  default:
    - parallel:
      - step:
          name: 'Build and Test'
          script:
            - echo "Your build and test goes here..."
      - step:
          name: 'Lint'
          script:
            - echo "Your linting goes here..."
      - step:
          name: 'Security scan'
          script:
            - echo "Your security scan goes here..."

    # The following deployment steps will be executed for each pipeline run. To configure your steps and conditionally deploy see https://support.atlassian.com/bitbucket-cloud/docs/configure-bitbucket-pipelinesyml/
    - step:
        name: 'Deployment to Staging'
        deployment: staging
        script:
          - echo "Your deployment to staging script goes here..."
    - step:
        name: 'Deployment to Production'
        deployment: production
        trigger: 'manual'
        script:
          - echo "Your deployment to production script goes here..."
    - step:
        name: 'Post Metrics to Compass'
        image: curlimages/curl:7.73.0
        script:
          - echo "Posting metrics to Compass..."
          - export USER_EMAIL="hemanth.m@mgtechsoft.com"
          - export USER_API_KEY="ATATT3xFfGF0YL9zUFL7RjY9fhnEagloHY_G8rvqOCtv-fdRSOctwOWaheFDhca5RH4w4MkHzKuri-yyoTtmRd-KU50ZoRZPJqvJCICH3srNMnm24NT0_5DRZlCwN7NJVXGlNMfOl3emruGLXwgmCkvT10HyNYBpXzmqVEm6zOO9qVTZnR7ossE=BAEA3196"
          - export METRIC_VALUE= >%
          - timestamp=$(date -u +'2024-06-10T12::00:00Z')
          - |
            curl --request POST \
                 --url https://mgtechdemo.atlassian.net/gateway/api/compass/v1/metrics \
                 --user "$USER_EMAIL:$USER_API_KEY" \
                 --header "Accept: application/json" \
                 --header "Content-Type: application/json" \
                 --data "{
                   \"metricSourceId\": \"ari:cloud:compass:471482bd-fced-4aab-acdd-db1234567890\",
                   \"value\": $METRIC_VALUE,
                   \"timestamp\": \"$timestamp\"
                 }"
          - echo "Metrics posted to Compass."