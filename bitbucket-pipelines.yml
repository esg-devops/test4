# bitbucket-pipelines.yml
image: docker:20.10.16  # Use a Docker image with Docker CLI installed

pipelines:
  branches:
    main:
      - step:
          name: Build
          services:
            - docker
          script:
            - echo "Simulating Build Process with Docker"
            - docker pull alpine:latest  # Pull a lightweight image
            - docker run --rm alpine:latest echo "Build process inside container"
            - echo "Build successful"

      - step:
          name: Test
          services:
            - docker
          script:
            - echo "Simulating Test Process"
            - docker run --rm alpine:latest sh -c "echo 'Running tests in container'; ls /bin"  # List contents to simulate tests
            - echo "All tests passed"

      - step:
          name: Approval
          trigger: manual
          script:
            - echo "Deployment approval required"

      - step:
          name: Deploy
          script:
            - echo "Deploying to Production"
            - echo "Deployment simulated successfully"

definitions:
  services:
    docker:
      memory: 1024  # Allocating memory for the Docker service
